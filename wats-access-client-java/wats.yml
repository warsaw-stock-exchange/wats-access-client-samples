# Connectivity data
services: &services_default
  market_data: &market_data_default
    snapshot:
      host: 127.0.0.1
      port: 10033
    stream:
      host: 224.3.1.1
      port: 10009
      interface: lo
    replay:
      host: 127.0.0.1
      port: 10011
  delayed_market_data: &delayed_market_data_default
    stream:
      host: 224.5.1.1
      port: 10031
      interface: lo
    replay:
      host: 127.0.0.1
      port: 10034
  best_bid_offer: &best_bid_offer_default
    stream:
      host: 224.3.1.1
      port: 10031
      interface: lo
    replay:
      host: 127.0.0.1
      port: 10032
  trading_port: &trading_port_default
    host: 127.0.0.1
    port: 10010

# Connections pool
connections:
  market_data_connection_0: &market_data_connection_0_default
    connection_id: 587
    token: ABCDEFGH
  market_data_connection_1: &market_data_connection_1_default
    connection_id: 595
    token: ABCDEFGH
  best_bid_offer_connection_0: &best_bid_offer_connection_0_default
    connection_id: 609
    token: ABCDEFGH
  trading_port_connection_0: &trading_port_connection_0_default
    connection_id: 581
    token: ABCDEFGH
  trading_port_connection_1: &trading_port_connection_1_default
    connection_id: 589
    token: ABCDEFGH
  trading_port_connection_2: &trading_port_connection_2_default
    connection_id: 597
    token: ABCDEFGH
  trading_port_connection_3: &trading_port_connection_3_default
    connection_id: 599
    token: ABCDEFGH

